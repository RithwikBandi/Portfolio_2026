<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Cursor test</title>
<link rel="stylesheet" href="/cursor-test.css"></head><body>
<h1>Batman cursor test</h1><p>Hover each tile. The cursor should change to the matching bat.</p>
<div class="g">
<a href="#" class="t">Link (hand)</a>
<button class="t">Button (hand)</button>
<div class="t" role="button" tabindex="0">role=button (hand)</div>
<div class="t">Normal</div>
<input class="t" value="Text input (I-beam)">
<textarea class="t">Textarea (sword)</textarea>
<button class="t" disabled>Disabled (unavailable)</button>
<div class="t" data-cursor="help">Help</div>
<div class="t" data-cursor="crosshair">Precision</div>
<div class="t" data-cursor="move">Move</div>
<div class="t" data-cursor="ew-resize">Resize ↔</div>
<div class="t" data-cursor="ns-resize">Resize ↕</div>
<div class="t" data-cursor="nwse-resize">Resize ↖↘</div>
<div class="t" data-cursor="nesw-resize">Resize ↗↙</div>
<button class="t" data-anim="busy">Busy (3s)</button>
<button class="t" data-anim="working">Working in background (3s)</button>
</div>
<script>
fetch('/cursors/frames.json').then(r => r.json()).then(c => {
  document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => {
    const k = b.dataset.anim, { frames, ms } = c[k], root = document.documentElement
    let i = 0
    root.classList.add('anim')
    const tick = () => {
      const [x, y] = frames[i], u = '/cursors/' + k + '-' + i
      root.style.setProperty('--anim-cursor', "image-set(url('" + u + ".png') 1x, url('" + u + "@2x.png') 2x) " + x + ' ' + y + ', progress')
      i = (i + 1) % frames.length
    }
    tick()
    const id = setInterval(tick, Math.max(ms, 80))
    setTimeout(() => { clearInterval(id); root.classList.remove('anim') }, 3000)
  })
})
</script>
</body></html>
