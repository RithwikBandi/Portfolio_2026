<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--head-->
    <script>
      // Runs before first paint: a reveal fallback flag for browsers without
      // scroll-driven animations (Firefox). No flash, no layout work.
      (function () {
        var d = document.documentElement;
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var native = window.CSS && CSS.supports && CSS.supports('animation-timeline', 'view()');
        if (!reduce && !native) {
          d.classList.add('reveal-js');
          setTimeout(function () { d.classList.remove('reveal-js'); }, 5000);
        }
      })();
    </script>
    <noscript><style>[data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
